name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated pages are up to date
        run: python3 tools/build_site.py --check
      - name: Links, images, schema, hreflang
        run: python3 tools/check_site.py
